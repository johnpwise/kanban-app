name: review-change
version: 1
interface:
  display_name: Review Change
  short_description: Review a completed diff through diff-classified lenses — correctness always, plus accessibility, composition, state ownership, contracts, persistence, error/observability, and route boundary when the diff touches them.
  default_prompt: Classify this diff, run the correctness lens plus every conditional lens the diff touches, and return findings split into blocking (changes-required) and follow-up, recording which lenses ran and why each skipped one was skipped.
